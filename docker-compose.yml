name: sgciu

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - sgciu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@db:5432/app_db
      CORS_ORIGINS: http://localhost:5173
    command:
      - sh
      - -c
      - alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 20s

  frontend:
    restart: unless-stopped
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s

volumes:
  sgciu_postgres_data:
