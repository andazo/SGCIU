name: SGCIU CI

on:
  workflow_dispatch:
  pull_request:
    branches: [Develop, main]
  push:
    branches: [Develop, main]

permissions:
  contents: read

concurrency:
  group: sgciu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-flow:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require Develop as the source of production pull requests
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "Develop"

  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+pysqlite:///ci.db
      OPENAI_API_KEY: test-key-not-used
      REQUIRE_ADMIN_AUTH: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner=off
      - name: Check style and static rules
        run: ruff check app tests migrations
      - name: Verify migrations from an empty database
        run: alembic -c alembic.ini upgrade head
      - name: Run complete suite with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Validate versioned cost projection
        run: PYTHONPATH=. python -m app.evaluation.cost_report --check

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Build production bundle
        run: npm run build

  verify-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate YAML, JSON and shell syntax
        run: |
          ruby -e 'require "yaml"; YAML.load(File.read("infra/cloudbuild.yaml"))'
          python -m json.tool infra/monitoring/dashboard.json >/dev/null
          for policy in infra/monitoring/policies/*.json; do
            python -m json.tool "$policy" >/dev/null
          done
          sh -n infra/monitoring/setup.sh
          sh -n infra/iam/setup-cloud-build.sh
          shellcheck infra/monitoring/setup.sh
          shellcheck infra/iam/setup-cloud-build.sh
          docker compose config --quiet

  verify-images:
    needs: [verify-backend, verify-frontend, verify-infrastructure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image
        run: docker build --tag sgciu-backend:ci backend
      - name: Build frontend image
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=https://api.invalid.example
          --tag sgciu-frontend:ci
          frontend
