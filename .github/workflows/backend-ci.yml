name: SGCIU CI

on:
  workflow_dispatch:
  pull_request:
    branches: [Develop, main]
  push:
    branches: [Develop, main]

permissions:
  contents: read

concurrency:
  group: sgciu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-flow:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require Develop as the source of production pull requests
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "Develop"

  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+pysqlite:///ci.db
      OPENAI_API_KEY: test-key-not-used
      REQUIRE_ADMIN_AUTH: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner=off
      - name: Check style and static rules
        run: ruff check app tests migrations
      - name: Verify migrations from an empty database
        run: alembic -c alembic.ini upgrade head
      - name: Run complete suite with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Validate versioned cost projection
        run: PYTHONPATH=. python -m app.evaluation.cost_report --check

  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Build production bundle
        run: npm run build

  verify-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate YAML, JSON and shell syntax
        run: |
          ruby -e 'require "yaml"; YAML.load(File.read("infra/cloudbuild.yaml"))'
          python -m json.tool infra/monitoring/dashboard.json >/dev/null
          for policy in infra/monitoring/policies/*.json; do
            python -m json.tool "$policy" >/dev/null
          done
          sh -n infra/monitoring/setup.sh
          sh -n infra/iam/setup-cloud-build.sh
          shellcheck infra/monitoring/setup.sh
          shellcheck infra/iam/setup-cloud-build.sh
          cp .env.example .env
          docker compose config --quiet

  verify-images:
    needs: [verify-backend, verify-frontend, verify-infrastructure, verify-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend image
        run: docker build --tag sgciu-backend:ci backend
      - name: Build frontend image
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=https://api.invalid.example
          --tag sgciu-frontend:ci
          frontend
      - name: Scan backend OS and Python packages
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: sgciu-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan frontend OS packages
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: sgciu-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  verify-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched history for credentials
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_LOG_OPTS: '--all --full-history'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Audit Python source for security issues
        run: |
          pip install bandit==1.9.4
          bandit -r backend/app -ll
